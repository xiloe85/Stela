[package]
name = "stela-mesa"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later AND MIT AND Apache-2.0 WITH LLVM-exception"
description = "Mesa's NVK, NIR and NAK, linked into stela.efi"
repository = "https://github.com/tylertms/Stela"
rust-version = "1.99"
build = "build.rs"

# A workspace of its own, holding the crates under it that it names: they
# build only for `stela.efi`, from sources `cargo xtask gpu nvk` generates.
# Without this table Cargo searches past the root's `exclude` for an outer
# workspace, and a checkout nested in another, such as a git worktree inside
# the main checkout, finds that checkout's root and refuses the package.
[workspace]

[dependencies]
nak = { package = "stela-mesa-nak", path = "nak" }
nil = { package = "stela-mesa-nil", path = "nil" }

[build-dependencies]
stela-fingerprint = { path = "../stela-fingerprint" }
